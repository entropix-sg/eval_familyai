apiVersion: v1
kind: Namespace
metadata:
  name: android-testing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-emulator
  namespace: android-testing
spec:
  replicas: 1
  # 同一设备只接收一个测试会话；更新时先停旧设备。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: android-emulator
  template:
    metadata:
      labels:
        app: android-emulator
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      containers:
        - name: emulator
          image: registry.example.com/testing/android-emulator:api35-app-v1
          imagePullPolicy: IfNotPresent
          # 通用容器运行时需要设备 cgroup 权限；仅挂载设备路径通常不够。
          # 已有 KVM device plugin 时，可改用其扩展资源并去掉 privileged。
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: adb-server
              containerPort: 5037
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: EMULATOR_MEMORY_MB
              value: "2048"
            - name: EMULATOR_CORES
              value: "4"
            - name: BOOT_TIMEOUT_SECONDS
              value: "600"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 12Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 24Gi
          startupProbe:
            exec:
              command: [/usr/local/bin/healthcheck.sh, ready]
            periodSeconds: 10
            timeoutSeconds: 12
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [/usr/local/bin/healthcheck.sh, ready]
            periodSeconds: 10
            timeoutSeconds: 12
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/usr/local/bin/healthcheck.sh, live]
            periodSeconds: 30
            timeoutSeconds: 12
            failureThreshold: 5
          volumeMounts:
            - name: device-data
              mountPath: /data
            - name: shared-memory
              mountPath: /dev/shm
            - name: kvm
              mountPath: /dev/kvm
      volumes:
        - name: device-data
          emptyDir:
            sizeLimit: 20Gi
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: android-emulator
  namespace: android-testing
spec:
  type: ClusterIP
  selector:
    app: android-emulator
  ports:
    - name: adb-server
      port: 5037
      targetPort: adb-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: android-emulator-adb
  namespace: android-testing
spec:
  podSelector:
    matchLabels:
      app: android-emulator
  policyTypes: [Ingress]
  ingress:
    - from:
        # 仅允许同 namespace 中带此标签的测试程序访问 ADB。
        - podSelector:
            matchLabels:
              android-adb-client: "true"
      ports:
        - protocol: TCP
          port: 5037
